<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" width="900" height="545" font-family="Tahoma, 'Noto Sans Thai', Arial, sans-serif">
  <rect width="900" height="545" fill="#ffffff"/>

  <!-- ============ (ก) Q ปกติ ============ -->
  <g transform="translate(0,50)">
    <text x="30" y="-18" font-size="16" font-weight="bold" fill="#222">(ก) Q ปกติ: setup / hold met → Q เปลี่ยนค่าชัดเจนหลัง tCO</text>

    <!-- logic level guides -->
    <line x1="100" y1="110" x2="700" y2="110" stroke="#bbb" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="100" y1="160" x2="700" y2="160" stroke="#bbb" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="712" y="114" font-size="13" fill="#555">logic 1</text>
    <text x="712" y="164" font-size="13" fill="#555">logic 0</text>

    <!-- edge -->
    <line x1="300" y1="15" x2="300" y2="175" stroke="#444" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="300" y="9" text-anchor="middle" font-size="12" fill="#444">ขอบ clock</text>

    <text x="30" y="55" font-size="16" font-weight="bold" fill="#222">CLK</text>
    <text x="30" y="140" font-size="16" font-weight="bold" fill="#222">Q</text>

    <path d="M100,70 H300 V30 H500 V70 H700" fill="none" stroke="#1565c0" stroke-width="3"/>
    <path d="M100,160 H340 V110 H700" fill="none" stroke="#6a1b9a" stroke-width="3"/>

    <line x1="300" y1="188" x2="340" y2="188" stroke="#6a1b9a" stroke-width="2"/>
    <polygon points="300,188 308,184 308,192" fill="#6a1b9a"/>
    <polygon points="340,188 332,184 332,192" fill="#6a1b9a"/>
    <text x="320" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#6a1b9a">tCO</text>
  </g>

  <line x1="30" y1="270" x2="870" y2="270" stroke="#ddd" stroke-width="1"/>

  <!-- ============ (ข) Q metastable ============ -->
  <g transform="translate(0,320)">
    <text x="30" y="-18" font-size="16" font-weight="bold" fill="#d32f2f">(ข) Q เกิด metastable: setup / hold ไม่ met → Q ค้างระดับกลาง แล้วค่อย settle</text>

    <line x1="100" y1="110" x2="700" y2="110" stroke="#bbb" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="100" y1="160" x2="700" y2="160" stroke="#bbb" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="100" y1="135" x2="700" y2="135" stroke="#d32f2f" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
    <text x="712" y="114" font-size="13" fill="#555">logic 1</text>
    <text x="712" y="139" font-size="13" fill="#d32f2f">ระดับกลาง</text>
    <text x="712" y="164" font-size="13" fill="#555">logic 0</text>

    <line x1="300" y1="15" x2="300" y2="175" stroke="#444" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="300" y="9" text-anchor="middle" font-size="12" fill="#444">ขอบ clock</text>

    <text x="30" y="55" font-size="16" font-weight="bold" fill="#222">CLK</text>
    <text x="30" y="140" font-size="16" font-weight="bold" fill="#222">Q</text>

    <path d="M100,70 H300 V30 H500 V70 H700" fill="none" stroke="#1565c0" stroke-width="3"/>

    <!-- Q: low, then metastable wobble around mid level, then settles to 1 (solid) or 0 (dashed) -->
    <path d="M100,160 H340" fill="none" stroke="#6a1b9a" stroke-width="3"/>
    <polyline points="340,160 340,135 360,120 385,150 410,125 435,145 460,131 480,135" fill="none" stroke="#d32f2f" stroke-width="3"/>
    <path d="M480,135 V110 H700" fill="none" stroke="#6a1b9a" stroke-width="3"/>
    <path d="M480,135 V160 H700" fill="none" stroke="#6a1b9a" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>

    <text x="410" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#d32f2f">metastable</text>
    <text x="590" y="102" text-anchor="middle" font-size="12" fill="#6a1b9a">settle เป็น 1 หรือ 0 (ไม่แน่นอน)</text>

    <line x1="340" y1="188" x2="480" y2="188" stroke="#d32f2f" stroke-width="2"/>
    <polygon points="340,188 348,184 348,192" fill="#d32f2f"/>
    <polygon points="480,188 472,184 472,192" fill="#d32f2f"/>
    <text x="410" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#d32f2f">tMET (settling time)</text>
  </g>
</svg>
