<svg viewBox="0 0 950 560" xmlns="http://www.w3.org/2000/svg" font-family="Tahoma, sans-serif">
  <rect x="0" y="0" width="950" height="560" fill="#ffffff"/>

  <text x="475" y="30" font-size="19" font-weight="bold" text-anchor="middle" fill="#1a1a2e">โครงสร้างภายใน FPGA Slice / CLB เดียวกัน — 3 เส้นทางที่เป็นไปได้</text>

  <!-- Outer Slice boundary -->
  <rect x="40" y="55" width="870" height="470" rx="10" fill="#f4f6f7" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="60" y="78" font-size="13" fill="#7f8c8d">Slice / CLB หนึ่งตัว (LUT + FF ตัวเดียวกัน ใช้ร่วมกันทั้ง 3 เส้นทาง)</text>

  <!-- LUT box -->
  <rect x="120" y="230" width="150" height="110" rx="6" fill="#eaf2f8" stroke="#2c3e50" stroke-width="2"/>
  <text x="195" y="270" font-size="15" font-weight="bold" text-anchor="middle" fill="#2c3e50">LUT</text>
  <text x="195" y="290" font-size="12" text-anchor="middle" fill="#2c3e50">(6-input</text>
  <text x="195" y="306" font-size="12" text-anchor="middle" fill="#2c3e50">Look-Up Table)</text>

  <!-- Inputs -->
  <text x="65" y="255" font-size="12" fill="#2c3e50">Inputs</text>
  <line x1="60" y1="250" x2="120" y2="250" stroke="#2c3e50" stroke-width="2"/>
  <line x1="60" y1="270" x2="120" y2="270" stroke="#2c3e50" stroke-width="2"/>
  <line x1="60" y1="290" x2="120" y2="290" stroke="#2c3e50" stroke-width="2"/>
  <line x1="60" y1="310" x2="120" y2="310" stroke="#2c3e50" stroke-width="2"/>

  <!-- Bypass MUX node right after LUT -->
  <circle cx="300" cy="285" r="12" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <text x="300" y="289" font-size="11" text-anchor="middle" fill="#2c3e50">M</text>
  <line x1="270" y1="285" x2="288" y2="285" stroke="#2c3e50" stroke-width="2"/>
  <text x="278" y="265" font-size="10.5" fill="#7f8c8d">Bypass Mux</text>

  <!-- FF box -->
  <rect x="500" y="230" width="150" height="110" rx="6" fill="#fdf2e9" stroke="#c0392b" stroke-width="2.5"/>
  <text x="575" y="262" font-size="15" font-weight="bold" text-anchor="middle" fill="#c0392b">D Flip-Flop</text>
  <text x="575" y="280" font-size="11" text-anchor="middle" fill="#c0392b">(Hardened Register</text>
  <text x="575" y="295" font-size="11" text-anchor="middle" fill="#c0392b">มีให้ในฮาร์ดแวร์ฟรี)</text>
  <text x="575" y="315" font-size="10" text-anchor="middle" fill="#7f8c8d">CLK / CE / SR</text>
  <line x1="575" y1="340" x2="575" y2="360" stroke="#c0392b" stroke-width="2"/>
  <text x="575" y="374" font-size="10.5" text-anchor="middle" fill="#c0392b">CLK ⏰</text>

  <!-- Output pin -->
  <rect x="820" y="270" width="60" height="30" rx="4" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <text x="850" y="290" font-size="12" text-anchor="middle" fill="#2c3e50">Output</text>

  <!-- Path A: LUT -> Mux -> FF -> Output (through FF, real register) -->
  <path d="M 312,278 C 380,180 430,180 500,255" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <path d="M 650,255 C 720,180 760,180 820,278" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="475" y="150" font-size="13.5" text-anchor="middle" fill="#c0392b" font-weight="bold">Path A: ผ่าน FF จริง (Edge-Triggered Register) — "ไม่ใช่ Latch"</text>

  <!-- Path B: LUT -> Mux -> Output directly (bypass FF, pure combinational) -->
  <path d="M 312,292 C 500,400 700,400 820,288" fill="none" stroke="#1e8449" stroke-width="2.5"/>
  <text x="475" y="425" font-size="13.5" text-anchor="middle" fill="#1e8449" font-weight="bold">Path B: Bypass ตรงจาก LUT → Output (Combinational ล้วน ไม่ผ่าน FF)</text>

  <!-- Path C: LUT output bypasses FF, then feeds back into LUT's own input = fake latch -->
  <path d="M 312,283 C 450,240 480,240 500,255" fill="none" stroke="#8e44ad" stroke-width="2.5" stroke-dasharray="7,4"/>
  <path d="M 300,297 C 260,420 100,420 60,340 L 60,250" fill="none" stroke="#8e44ad" stroke-width="2.5" stroke-dasharray="7,4" marker-end="url(#arrowPurple)"/>
  <text x="180" y="365" font-size="12.5" fill="#8e44ad" font-weight="bold" text-anchor="middle">Path C: Feedback วนกลับเข้า Input ของ LUT ตัวเดิม</text>
  <text x="180" y="382" font-size="12.5" fill="#8e44ad" font-weight="bold" text-anchor="middle">(ผ่าน Fabric Routing เอง ไม่ผ่าน FF เลย) = Latch ปลอม</text>

  <!-- Legend box -->
  <rect x="90" y="470" width="820" height="45" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="500" y="497" font-size="13" text-anchor="middle" fill="#c0392b" font-weight="bold">Latch เกิดจาก Path C เท่านั้น — เป็นการ "เดินสาย" LUT ตัวเดียวกันให้วนกลับเข้าตัวเอง ไม่ใช่วงจรฮาร์ดแวร์แยกต่างหาก และไม่ได้แตะ FF เลยแม้แต่น้อย</text>

  <defs>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8e44ad"/>
    </marker>
  </defs>
</svg>
