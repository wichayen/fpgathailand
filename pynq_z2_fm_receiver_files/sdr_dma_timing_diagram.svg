<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 525" width="100%" style="background:#0f172a; border: 1px solid #334155; border-radius: 14px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">  <defs>
    <!-- Arrowhead markers -->
    <marker id="tm-arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="tm-arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="tm-arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="tm-arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>

    <!-- Gradients for USB Buffers -->
    <linearGradient id="tm-buf0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="tm-buf1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="tm-buf2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="tm-buf3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="tm-buf4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <!-- Title & Subtitle -->
  <text x="490" y="28" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold" letter-spacing="0.5">Pipeline Timing Diagram: Multi-Buffer In-Flight Queueing &amp; Zero-Gap Audio</text>
  <text x="490" y="46" text-anchor="middle" fill="#94a3b8" font-size="11.5">การไหลของข้อมูลต่อเนื่องข้าม Time Slots 0.8s: จาก USB Ingestion สู่ Kernel In-Flight Queue และ FPGA Playback</text>
  <!-- Time Axis Header -->
  <g transform="translate(205, 54)">
    <line x1="0" y1="18" x2="750" y2="18" stroke="#475569" stroke-width="1.5"/>
    
    <!-- Ticks & Labels -->
    <line x1="0" y1="12" x2="0" y2="24" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="7" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">t = 0.0s</text>

    <line x1="150" y1="12" x2="150" y2="24" stroke="#64748b" stroke-width="1.5"/>
    <text x="150" y="7" text-anchor="middle" fill="#cbd5e1" font-size="11">0.8s</text>

    <line x1="300" y1="12" x2="300" y2="24" stroke="#64748b" stroke-width="1.5"/>
    <text x="300" y="7" text-anchor="middle" fill="#cbd5e1" font-size="11">1.6s</text>

    <line x1="450" y1="12" x2="450" y2="24" stroke="#64748b" stroke-width="1.5"/>
    <text x="450" y="7" text-anchor="middle" fill="#cbd5e1" font-size="11">2.4s</text>

    <line x1="600" y1="12" x2="600" y2="24" stroke="#64748b" stroke-width="1.5"/>
    <text x="600" y="7" text-anchor="middle" fill="#cbd5e1" font-size="11">3.2s</text>

    <line x1="750" y1="12" x2="750" y2="24" stroke="#38bdf8" stroke-width="2"/>
    <text x="750" y="7" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">4.0s</text>
  </g>
  <!-- Grid Vertical Guidelines -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" transform="translate(205, 74)">
    <line x1="0" y1="0" x2="0" y2="366"/>
    <line x1="150" y1="0" x2="150" y2="366"/>
    <line x1="300" y1="0" x2="300" y2="366"/>
    <line x1="450" y1="0" x2="450" y2="366"/>
    <line x1="600" y1="0" x2="600" y2="366"/>
    <line x1="750" y1="0" x2="750" y2="366"/>
  </g>
  <!-- ROW 1: RTL-SDR USB (librtlsdr) -->
  <g transform="translate(18, 80)">
    <rect x="0" y="0" width="174" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="18" fill="#f8fafc" font-size="10.5" font-weight="bold">1. RTL-SDR (USB)</text>
    <text x="12" y="32" fill="#94a3b8" font-size="9">Bulk Stream (3.84 MB/s)</text>

    <!-- Buffer Blocks across 5 time slots -->
    <g transform="translate(187, 4)">
      <!-- 0.0 - 0.8s: B0 -> RAW0 -->
      <rect x="0" y="0" width="146" height="34" rx="5" fill="url(#tm-buf0)" stroke="#10b981" stroke-width="1.2"/>
      <text x="73" y="16" text-anchor="middle" fill="#a7f3d0" font-size="10" font-weight="bold">Rx: B0 → RAW0</text>
      <text x="73" y="28" text-anchor="middle" fill="#6ee7b7" font-size="8.5">(1.536M IQ samples)</text>

      <!-- 0.8 - 1.6s: B1 -> RAW1 -->
      <rect x="150" y="0" width="146" height="34" rx="5" fill="url(#tm-buf1)" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="223" y="16" text-anchor="middle" fill="#bae6fd" font-size="10" font-weight="bold">Rx: B1 → RAW1</text>
      <text x="223" y="28" text-anchor="middle" fill="#7dd3fc" font-size="8.5">(1.536M IQ samples)</text>

      <!-- 1.6 - 2.4s: B2 -> RAW2 -->
      <rect x="300" y="0" width="146" height="34" rx="5" fill="url(#tm-buf2)" stroke="#818cf8" stroke-width="1.2"/>
      <text x="373" y="16" text-anchor="middle" fill="#e0e7ff" font-size="10" font-weight="bold">Rx: B2 → RAW2</text>
      <text x="373" y="28" text-anchor="middle" fill="#c7d2fe" font-size="8.5">(1.536M IQ samples)</text>

      <!-- 2.4 - 3.2s: B3 -> RAW3 -->
      <rect x="450" y="0" width="146" height="34" rx="5" fill="url(#tm-buf3)" stroke="#fbbf24" stroke-width="1.2"/>
      <text x="523" y="16" text-anchor="middle" fill="#fef3c7" font-size="10" font-weight="bold">Rx: B3 → RAW3</text>
      <text x="523" y="28" text-anchor="middle" fill="#fde68a" font-size="8.5">(1.536M IQ samples)</text>

      <!-- 3.2 - 4.0s: B4 -> RAW4 -->
      <rect x="600" y="0" width="146" height="34" rx="5" fill="url(#tm-buf4)" stroke="#f472b6" stroke-width="1.2"/>
      <text x="673" y="16" text-anchor="middle" fill="#fce7f3" font-size="10" font-weight="bold">Rx: B4 → RAW4</text>
      <text x="673" y="28" text-anchor="middle" fill="#fbcfe8" font-size="8.5">(RAW Ring 6 Slots)</text>
    </g>
  </g>
  <!-- Pre-buffer Indicator Annotation -->
  <g transform="translate(205, 127)">
    <rect x="0" y="0" width="296" height="17" rx="3.5" fill="#0369a1" fill-opacity="0.28" stroke="#0284c7" stroke-dasharray="3 3"/>
    <text x="148" y="12" text-anchor="middle" fill="#7dd3fc" font-size="9" font-weight="bold">Initial Pre-buffering: รวบรวมครบ 2 บล็อกแรก (PREBUF_DEF = 2) เพื่อความเสถียร</text>
  </g>
  <!-- ROW 2: Kernel In-Flight Queue -->
  <g transform="translate(18, 150)">
    <rect x="0" y="0" width="174" height="56" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="18" fill="#f8fafc" font-size="10.5" font-weight="bold">2. Kernel In-Flight</text>
    <text x="12" y="33" fill="#60a5fa" font-size="9">ioctl(SDR_DMA_START)</text>
    <text x="12" y="46" fill="#34d399" font-size="8.5" font-weight="bold">NINFLIGHT = 2 Queued</text>

    <!-- In-flight slots across time -->
    <g transform="translate(187, 4)">
      <!-- 0.0 - 1.6s: Pre-buffer Idle in Kernel Queue -->
      <rect x="0" y="0" width="296" height="48" rx="4" fill="#0f172a" stroke="#334155" stroke-dasharray="3 3"/>
      <text x="148" y="28" text-anchor="middle" fill="#64748b" font-size="9.5">Queue Idle (รอ Pre-buffer ครบ 2 บล็อก)</text>

      <!-- 1.6 - 2.4s: TX0 (B0) Armed/Active & TX1 (B1) Queued -->
      <rect x="300" y="1" width="146" height="22" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="373" y="15" text-anchor="middle" fill="#34d399" font-size="9" font-weight="bold">In-Flight: TX0 (B0) [Armed]</text>

      <rect x="300" y="25" width="146" height="22" rx="3" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
      <text x="373" y="39" text-anchor="middle" fill="#60a5fa" font-size="9" font-weight="bold">In-Flight: TX1 (B1) [Queued]</text>

      <!-- 2.4 - 3.2s: TX1 (B1) Active & TX2 (B2) Queued -->
      <rect x="450" y="1" width="146" height="22" rx="3" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
      <text x="523" y="15" text-anchor="middle" fill="#60a5fa" font-size="9" font-weight="bold">In-Flight: TX1 (B1) [Active]</text>

      <rect x="450" y="25" width="146" height="22" rx="3" fill="#4c1d95" stroke="#8b5cf6" stroke-width="1"/>
      <text x="523" y="39" text-anchor="middle" fill="#c4b5fd" font-size="9" font-weight="bold">In-Flight: TX2 (B2) [Queued]</text>

      <!-- 3.2 - 4.0s: TX2 (B2) Active & TX3 (B3) Queued -->
      <rect x="600" y="1" width="146" height="22" rx="3" fill="#4c1d95" stroke="#8b5cf6" stroke-width="1"/>
      <text x="673" y="15" text-anchor="middle" fill="#c4b5fd" font-size="9" font-weight="bold">In-Flight: TX2 (B2) [Active]</text>

      <rect x="600" y="25" width="146" height="22" rx="3" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
      <text x="673" y="39" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="bold">In-Flight: TX3 (B3) [Queued]</text>
    </g>
  </g>
  <!-- Zero-Gap Handoff Badges (Dedicated non-overlapping zone) -->
  <g transform="translate(655, 218)">
    <line x1="0" y1="-8" x2="0" y2="30" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="2.5 2.5"/>
    <rect x="-56" y="0" width="112" height="18" rx="4" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
    <text x="0" y="12.5" text-anchor="middle" fill="#fde68a" font-size="9" font-weight="bold">Zero-Gap (0 ms)</text>
  </g>

  <g transform="translate(805, 218)">
    <line x1="0" y1="-8" x2="0" y2="30" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="2.5 2.5"/>
    <rect x="-56" y="0" width="112" height="18" rx="4" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
    <text x="0" y="12.5" text-anchor="middle" fill="#fde68a" font-size="9" font-weight="bold">Zero-Gap (0 ms)</text>
  </g>
  <!-- ROW 3: FPGA AXI DMA Playback (Hardware Stream) -->
  <g transform="translate(18, 246)">
    <rect x="0" y="0" width="174" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="18" fill="#f8fafc" font-size="10.5" font-weight="bold">3. FPGA AXI DMA</text>
    <text x="12" y="32" fill="#34d399" font-size="9">MM2S Hardware Stream</text>
    <text x="12" y="44" fill="#94a3b8" font-size="8.5">FIR → FM Demod → LPF</text>

    <!-- Playback Streams -->
    <g transform="translate(187, 5)">
      <!-- 0.0 - 1.6s: Prebuf Idle / Mute -->
      <rect x="0" y="0" width="296" height="40" rx="4" fill="#0f172a" stroke="#334155" stroke-dasharray="4 4"/>
      <text x="148" y="24" text-anchor="middle" fill="#64748b" font-size="10">Waiting Pre-buffer (Muted / Initializing)</text>

      <!-- 1.6 - 2.4s: TX0 (B0) Streaming -->
      <rect x="300" y="0" width="146" height="40" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1.8"/>
      <text x="373" y="18" text-anchor="middle" fill="#a7f3d0" font-size="10.5" font-weight="bold">TX0 (B0) Playing</text>
      <text x="373" y="32" text-anchor="middle" fill="#6ee7b7" font-size="8.5">(0.8s Hardware Stream)</text>

      <!-- 2.4 - 3.2s: TX1 (B1) Streaming -->
      <rect x="450" y="0" width="146" height="40" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.8"/>
      <text x="523" y="18" text-anchor="middle" fill="#bfdbfe" font-size="10.5" font-weight="bold">TX1 (B1) Playing</text>
      <text x="523" y="32" text-anchor="middle" fill="#93c5fd" font-size="8.5">(0.8s Hardware Stream)</text>

      <!-- 3.2 - 4.0s: TX2 (B2) Streaming -->
      <rect x="600" y="0" width="146" height="40" rx="4" fill="#4c1d95" stroke="#8b5cf6" stroke-width="1.8"/>
      <text x="673" y="18" text-anchor="middle" fill="#ddd6fe" font-size="10.5" font-weight="bold">TX2 (B2) Playing</text>
      <text x="673" y="32" text-anchor="middle" fill="#c4b5fd" font-size="8.5">(0.8s Hardware Stream)</text>
    </g>
  </g>
  <!-- ROW 4: Audio DAC Output -->
  <g transform="translate(18, 308)">
    <rect x="0" y="0" width="174" height="44" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="18" fill="#f8fafc" font-size="10.5" font-weight="bold">4. Audio Out (3.5mm)</text>
    <text x="12" y="33" fill="#38bdf8" font-size="9">ADAU1761 @ 48 kHz PCM</text>

    <g transform="translate(187, 4)">
      <!-- 0.0 - 1.6s: Mute / Silence -->
      <rect x="0" y="0" width="296" height="36" rx="4" fill="#0f172a" stroke="#334155"/>
      <text x="148" y="22" text-anchor="middle" fill="#475569" font-size="9.5">Silence (Pre-buffering)</text>

      <!-- 1.6 - 4.0s: Continuous Audio Wave -->
      <rect x="300" y="0" width="446" height="36" rx="4" fill="#064e3b" fill-opacity="0.35" stroke="#10b981" stroke-width="1.2"/>
      <path d="M 310 18 Q 325 7 340 18 T 370 18 T 400 18 T 430 18 T 460 18 T 490 18 T 520 18 T 550 18 T 580 18 T 610 18 T 640 18 T 670 18 T 700 18 T 730 18" fill="none" stroke="#34d399" stroke-width="1.8"/>
      <text x="523" y="22" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">Continuous Smooth FM Audio (เสียงลื่นไหลต่อเนื่อง ไม่มีสะดุด 100%)</text>
    </g>
  </g>
  <!-- ROW 5: DMA Thread State -->
  <g transform="translate(18, 364)">
    <rect x="0" y="0" width="174" height="48" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="18" fill="#f8fafc" font-size="10.5" font-weight="bold">5. CPU (DMA Thread)</text>
    <text x="12" y="32" fill="#34d399" font-size="9">Zero CPU Polling (&lt; 2%)</text>
    <text x="12" y="44" fill="#94a3b8" font-size="8">Interrupt-driven Sleep</text>

    <g transform="translate(187, 4)">
      <!-- 0.0 - 1.6s: Sleep on pthread_cond_wait -->
      <rect x="0" y="0" width="296" height="40" rx="4" fill="#0f172a" stroke="#334155"/>
      <text x="148" y="24" text-anchor="middle" fill="#64748b" font-size="9">Sleep (pthread_cond_wait: cnt &lt; 2)</text>

      <!-- 1.6 - 4.0s: Sleep on wait_for_completion with Interrupt wakeups -->
      <!-- 1.6 - 2.4s: Sleep -->
      <rect x="300" y="0" width="146" height="40" rx="4" fill="#0f172a" stroke="#475569"/>
      <text x="373" y="24" text-anchor="middle" fill="#64748b" font-size="8.5">Sleep (wait_for_comp)</text>

      <!-- 2.4 - 3.2s: Sleep -->
      <rect x="450" y="0" width="146" height="40" rx="4" fill="#0f172a" stroke="#475569"/>
      <text x="523" y="24" text-anchor="middle" fill="#64748b" font-size="8.5">Sleep (wait_for_comp)</text>

      <!-- 3.2 - 4.0s: Sleep -->
      <rect x="600" y="0" width="146" height="40" rx="4" fill="#0f172a" stroke="#475569"/>
      <text x="673" y="24" text-anchor="middle" fill="#64748b" font-size="8.5">Sleep (wait_for_comp)</text>

      <!-- Wakeup Marker at 1.6s (Prebuf complete wakeup) -->
      <g transform="translate(300, 0)">
        <rect x="-5" y="0" width="10" height="40" fill="#38bdf8" rx="2"/>
        <text x="0" y="-3" text-anchor="middle" fill="#7dd3fc" font-size="8" font-weight="bold">Start</text>
      </g>

      <!-- Wakeup Pulses (IOC_Irq Interrupts) at 2.4s and 3.2s -->
      <g transform="translate(450, 0)">
        <rect x="-6" y="0" width="12" height="40" fill="#ef4444" rx="2"/>
        <text x="0" y="-3" text-anchor="middle" fill="#f87171" font-size="8" font-weight="bold">IRQ</text>
      </g>

      <g transform="translate(600, 0)">
        <rect x="-6" y="0" width="12" height="40" fill="#ef4444" rx="2"/>
        <text x="0" y="-3" text-anchor="middle" fill="#f87171" font-size="8" font-weight="bold">IRQ</text>
      </g>
    </g>
  </g>
  <!-- Summary Bottom Banner -->
  <g transform="translate(18, 432)">
    <rect x="0" y="0" width="944" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="16" y="22" fill="#38bdf8" font-size="11" font-weight="bold">จุดเด่นของไทม์มิ่งไปป์ไลน์ (Pipeline Key Highlights):</text>
    <text x="16" y="42" fill="#cbd5e1" font-size="10.2">1. Initial Pre-buffering: รวบรวม 2 บล็อกแรก (1.6s, PREBUF_DEF = 2) เพื่อสะสมบัฟเฟอร์สำรอง ป้องกันเสียงสะดุดช่วงเริ่มต้น 100%</text>
    <text x="16" y="58" fill="#cbd5e1" font-size="10.2">2. In-Flight Queueing: ยื่นคิวล่วงหน้า 2 บล็อก (NINFLIGHT = 2) ทำให้ฮาร์ดแวร์สลับเล่นบล็อกถัดไปทันทีแบบ Zero-Gap (0 ms)</text>
  </g>
</svg>
